name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m vaani evaluate --report data/ci-evaluation.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/client/voice-ui.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-python-${{ matrix.python }}
          path: data/ci-evaluation.json
  voice-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[voice]'
      - run: python -m unittest discover -s tests -v
