[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaani-sales-lab"
version = "0.2.0"
description = "Bilingual sales conversation engine, voice adapter, and evaluation lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
voice = ["livekit-agents[sarvam,silero]~=1.8.4", "python-dotenv>=1,<2"]

[project.scripts]
vaani = "vaani.__main__:main"

[tool.setuptools.package-data]
vaani = ["static/*", "schema.sql", "scenarios.json"]

[tool.setuptools.packages.find]
include = ["vaani*"]
